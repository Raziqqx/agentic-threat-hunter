[project]
name = "agentic-threat-hunter"
version = "0.1.0"
description = "LLM agents that hunt threats in synthetic security logs through a safeguarded MCP server"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0",
  "anthropic==2.8.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
