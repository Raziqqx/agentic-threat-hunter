name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PY: python
      # Mock LLM only: no key is configured, and the eval/tests force the mock provider anyway.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: python -m pytest -q
      - name: Data + eval smoke
        run: make data eval PY=python
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/eval*
